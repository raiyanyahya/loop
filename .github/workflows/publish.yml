name: Publish

# Publishes to npm with trusted publishing (OIDC): no token, no secret, no 2FA bypass.
# One-time setup on npmjs.com, @raiyanyahya/loop package settings, Trusted Publisher: GitHub Actions,
# user raiyanyahya, repository loop, workflow filename publish.yml. Provenance is automatic.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or newer is required for trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm test
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF does not match package version $v"; exit 1; }
      - name: Identity npm will see (compare with the trusted publisher on npmjs.com)
        run: |
          echo "repository        : $GITHUB_REPOSITORY        -> user 'raiyanyahya', repository 'loop'"
          echo "workflow file     : ${GITHUB_WORKFLOW_REF#*/.github/workflows/}" | sed 's/@.*//'
          echo "environment       : ${GITHUB_ENVIRONMENT:-(none; leave the field empty on npmjs.com)}"
          echo "package           : $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
      - run: npm publish --access public
